#
# GitHub Actions workflow.
#
# Releases the package to npm when a push into main is detected.
# * Run the PR checks
# * Bump the version number
# * Build
# * Publish to npm via GitHub trusted publishing (OIDC) — no NPM_TOKEN required
#

name: 'Release Package'

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:

    pr_checks:
        uses: ./.github/workflows/pr.yml
        secrets: inherit

    release:
        name: 'Release Package'
        runs-on: ubuntu-latest
        needs:
            - pr_checks
        permissions:
            contents: write   # push the version-bump commit + tag
            id-token: write    # mint the OIDC token for npm trusted publishing
        steps:
            -   name: 'Checkout'
                uses: actions/checkout@v4
                with:
                    token: ${{ secrets.GH_CI_CD_RELEASE }}

            -   name: 'Install Node.js'
                uses: actions/setup-node@v4
                with:
                    node-version: 24
                    registry-url: 'https://registry.npmjs.org/'

            -   name: 'Ensure npm supports trusted publishing'
                # Trusted publishing (OIDC) requires npm >= 11.5.1.
                run: npm install --global npm@latest

            -   name: 'Install dependencies'
                run: npm install

            -   run: git stash
            -   run: git pull --force

            -   name: 'Configure git to skip hooks for release'
                run: git config core.hooksPath /dev/null

            -   name: 'Version Bump'
                uses: phips28/gh-action-bump-version@master
                env:
                    GITHUB_TOKEN: ${{ secrets.GH_CI_CD_RELEASE }}
                with:
                    major-wording: 'major,breaking'
                    minor-wording: 'minor,feature,feat'
                    patch-wording: 'patch,fixes,fix,misc,docs,refactor,style,test,build,ci,chore,revert,perf'    # Providing patch-wording will override commits
                    commit-message: 'Release Package: Bump Version [skip ci]'
                    skip-tag: true

            -   name: 'Build'
                run: npm run build

            -   name: 'Verify trusted publishing environment'
                run: |
                    npm --version

                    if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
                      echo "::error::GitHub OIDC token is not available. Check the job has id-token: write."
                      exit 1
                    fi

                    echo "npm publish will authenticate via trusted publishing (OIDC)."

            -   name: 'Publish to npm (trusted publishing)'
                # No .npmrc auth token: npm mints an OIDC token from GitHub and
                # exchanges it with the registry. Provenance is attached
                # automatically. Requires a trusted publisher to be configured
                # for @juicyllama/repo on npmjs.com pointing at this repo and
                # the release.yml workflow.
                run: npm publish --access public
